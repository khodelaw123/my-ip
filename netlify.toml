# ==============================================================================
# Netlify Configuration for IP Viewer (Next.js Frontend + External PHP Backend)
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"

# Official Next.js Runtime plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ------------------------------------------------------------------------------
# Security & Cache Headers
# ------------------------------------------------------------------------------

# Global security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next.js immutable static build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static public assets (SVG icons, favicons)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API responses should never be cached
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
